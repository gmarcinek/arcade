rder-radius:8px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}.end-label{font-size:11px;opacity:.65;letter-spacing:2px;text-transform:uppercase}.end-score{font-size:64px;font-weight:700;color:#00d9ff;line-height:1}.end-stat{font-size:13px;opacity:.72;letter-spacing:1px}#respawn-overlay{display:none;position:fixed;inset:0;z-index:25;align-items:center;justify-content:center;flex-direction:column;gap:0;pointer-events:none;background:#02040e00}#respawn-overlay.active{display:flex}.respawn-label{font-size:13px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:#f42;opacity:.85;text-shadow:0 0 18px rgba(255,60,20,.8);margin-bottom:10px}.respawn-num{font-size:120px;font-weight:700;line-height:1;color:#f30;text-shadow:0 0 40px rgba(255,80,0,1),0 0 80px rgba(255,40,0,.6);animation:respawnPop .3s ease-out}.respawn-bum{font-size:72px;font-weight:700;letter-spacing:6px;text-transform:uppercase;color:#fc0;text-shadow:0 0 30px rgba(255,200,0,1),0 0 60px rgba(255,140,0,.8);animation:respawnBum .5s ease-out forwards}@keyframes respawnPop{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.92)}to{transform:scale(1);opacity:1}}@keyframes respawnBum{0%{transform:scale(.5);opacity:0}40%{transform:scale(1.25);opacity:1}70%{transform:scale(.95)}to{transform:scale(1);opacity:0}}</style>
</head>

<body>
    <canvas id="game-canvas"></canvas>
    <div id="respawn-overlay"></div>
    <div id="flash"></div>
    <div id="danger-warn"></div>

    <div class="hud hud-tl">

        <button id="hud-restart-btn" class="hud-restart-btn" type="button">restart</button>

        <div class="lbl">score</div>
        <div class="val-big" id="score">0</div>
        <div id="trick-display" style="margin-top:8px;">
            <div class="trick-name" id="trick-name"></div>
            <div class="trick-pts" id="trick-pts"></div>
        </div>


    </div>

    <div class="hud hud-tc">
        <div class="tc-row">
            <div class="tc-bar"></div>
            <div class="val-big" id="time">1:00</div>
            <div class="tc-bar tc-bar-r"></div>
        </div>
        <div class="lbl">time remaining</div>
    </div>

    <div class="hud hud-tr">
        <div class="lbl">distance</div>
        <div class="val" id="dist">0 m</div>
    </div>

    <div class="hud hud-bl">
        <div class="lbl">boost · shift</div>
        <div class="boost-segs" id="boost-fill">
            <div class="boost-seg" id="bseg-0"></div>
            <div class="boost-seg" id="bseg-1"></div>
            <div class="boost-seg" id="bseg-2"></div>
            <div class="boost-seg" id="bseg-3"></div>
        </div>
    </div>

    <div class="hud hud-br">
        <div class="spd-row"><span class="val" id="speed">0</span><span class="km">km/h</span></div>
        <div class="lbl" id="mode-indicator" style="color:#ff8800; margin-top:4px;"></div>
    </div>

    <div id="overlay">
        <div class="title">Tunnel rush</div>
        <div style="font-size: 14px; opacity: 0.85; max-width: 520px; text-align: center; line-height: 1.6;">
            Chromowana kula pędzi przez tunel. Trzymaj się jasnej strefy — ciemność to koniec.
        </div>
        <div class="hint-row">
            <span><span class="kbd">←</span><span class="kbd">→</span> skręt</span>
            <span><span class="kbd">space</span> skok</span>
            <span><span class="kbd">shift</span> boost</span>
        </div>
        <button class="btn" id="start-btn">start</button>
        <button class="btn" id="mode-btn"
            style="background: rgba(255,255,255,0.12); color: #cceeff; border: 1px solid rgba(0,217,255,0.4);">CLASSIC
            MODE</button>
        <button class="btn" id="flythrough-btn"
            style="background: rgba(0,255,180,0.1); color: #00ffcc; border: 1px solid rgba(0,255,180,0.4); font-size: 12px; padding: 8px 20px; margin-top: 4px;">
            FLYTHROUGH DEBUG
        </button>

        <div id="audio-panel"
            style="display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:12px;">
            <div style="display:flex; gap:6px; align-items:center;">
                <input id="spotify-input" type="url" placeholder="Spotify link…" style="background:rgba(0,0,0,0.4); border:1px solid rgba(255,106,0,0.35); color:#ff9955;
                           font-size:11px; padding:6px 10px; border-radius:4px; width:220px; outline:none;" />
                <button class="btn" id="open-spotify-btn" style="background:rgba(30,215,96,0.12); color:#1ed760; border:1px solid rgba(30,215,96,0.35);
                           font-size:11px; padding:6px 14px; margin-top:0;">
                    OPEN
                </button>
            </div>
            <button class="btn" id="audio-btn" style="background:rgba(255,106,0,0.15); color:#ff8844; border:1px solid rgba(255,106,0,0.4);
                       font-size:11px; padding:8px 20px;">
                ♫ AUDIO REACTIVE
            </button>
            <div id="audio-status"
                style="font-size:9px; letter-spacing:2px; color:rgba(255,140,60,0.55); text-transform:uppercase; display:none;">
                CAPTURING · <span id="audio-bpm">— BPM</span>
            </div>
        </div>
    </div>

</body>

</html>
