  <style rel="stylesheet" crossorigin>*,*:before,*:after{box-sizing:border-box;margin:0;padding:0}html,body{width:100vw;height:100vh;overflow:hidden;background:#02040c;font-family:Segoe UI,system-ui,sans-serif}#game-canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#flash{position:fixed;inset:0;pointer-events:none;background:transparent;transition:background .08s;z-index:10}#danger-warn{display:none;position:fixed;inset:0;pointer-events:none;z-index:15;align-items:center;justify-content:center;font-size:20px;font-weight:800;letter-spacing:3px;color:#f30;text-shadow:0 0 14px #ff6600,0 0 32px #ff0000;box-shadow:inset 0 0 100px 50px #ff1e0059}.hud{position:fixed;pointer-events:none;z-index:20;color:#fff;font-family:inherit}.hud-tl{top:16px;left:20px}.hud-tc{top:16px;left:50%;transform:translate(-50%);text-align:center;white-space:nowrap}.hud-tr{top:16px;right:20px;text-align:right}.hud-bl{bottom:22px;left:20px}.hud-br{bottom:22px;right:20px;text-align:right}.lbl{font-size:10px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:#6ac8d8;opacity:.75}.val{font-size:38px;font-weight:700;line-height:1.05}.val-big{font-size:46px;font-weight:700;line-height:1;margin-top:1px}.tc-row{display:flex;align-items:center;gap:12px}.tc-bar{width:68px;height:2px;background:linear-gradient(to right,transparent,rgba(0,210,255,.65))}.tc-bar-r{transform:scaleX(-1)}#time{font-size:50px;font-weight:700;letter-spacing:-1px}.boost-segs{display:flex;gap:3px;margin-top:7px;align-items:flex-end}.boost-seg{width:52px;height:18px;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);background:#00d2ff1f;border:1px solid rgba(0,210,255,.28);transition:background .12s,box-shadow .12s}.boost-seg.on{background:linear-gradient(135deg,#00c8ff,#0068cc);border-color:#00dcffb3;box-shadow:0 0 10px #00d2ffa6,inset 0 0 6px #ffffff1f}.boost-seg.pulse{animation:boostPulse .35s ease-out}@keyframes boostPulse{0%{box-shadow:0 0 18px #00d2ff,inset 0 0 8px #ffffff40}to{box- <body>
    <canvas id="game-canvas"></canvas>
    <div id="flash"></div>
    <div id="danger-warn"></div>

    <div class="hud hud-tl">
        <div class="lbl">score</div>
        <div class="val-big" id="score">0</div>
        <div id="trick-display" style="margin-top:8px;">
            <div class="trick-name" id="trick-name"></div>
            <div class="trick-pts" id="trick-pts"></div>
        </div>
    </div>

    <div class="hud hud-tc">
        <div class="tc-row">
            <div class="tc-bar"></div>
            <div class="val-big" id="time">1:00</div>
            <div class="tc-bar tc-bar-r"></div>
        </div>
        <div class="lbl">time remaining</div>
    </div>

    <div class="hud hud-tr">
        <div class="lbl">distance</div>
        <div class="val" id="dist">0 m</div>
    </div>

    <div class="hud hud-bl">
        <div class="lbl">boost · shift</div>
        <div class="boost-segs" id="boost-fill">
            <div class="boost-seg" id="bseg-0"></div>
            <div class="boost-seg" id="bseg-1"></div>
            <div class="boost-seg" id="bseg-2"></div>
            <div class="boost-seg" id="bseg-3"></div>
        </div>
    </div>

    <div class="hud hud-br">
        <div class="spd-row"><span class="val" id="speed">0</span><span class="km">km/h</span></div>
        <div class="lbl" id="mode-indicator" style="color:#ff8800; margin-top:4px;"></div>
    </div>

    <div id="overlay">
        <div class="title">Tunnel rush</div>
        <div style="font-size: 14px; opacity: 0.85; max-width: 520px; text-align: center; line-height: 1.6;">
            Chromowana kula pędzi przez tunel. Trzymaj się jasnej strefy — ciemność to koniec.
        </div>
        <div class="hint-row">
            <span><span class="kbd">←</span><span class="kbd">→</span> skręt</span>
            <span><span class="kbd">space</span> skok</span>
            <span><span class="kbd">shift</span> boost</span>
        </div>
        <button class="btn" id="start-btn">start</button>
        <button class="btn" id="mode-btn"
            style="background: rgba(255,255,255,0.12); color: #cceeff; border: 1px solid rgba(0,217,255,0.4);">CLASSIC
            MODE</button>
        <button class="btn" id="flythrough-btn"
            style="background: rgba(0,255,180,0.1); color: #00ffcc; border: 1px solid rgba(0,255,180,0.4); font-size: 12px; padding: 8px 20px; margin-top: 4px;">
            FLYTHROUGH DEBUG
        </button>
    </div>

</body>

</html>
